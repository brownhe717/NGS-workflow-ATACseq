# path or URL to sample sheet (TSV format, columns: sample, condition, ...)
samples: config/samples.tsv
# path or URL to sequencing unit sheet (TSV format, columns: sample, unit, fq1, fq2)
# Units are technical replicates (e.g. lanes, or resequencing of the same biological
# sample).
units: config/units.tsv

# optional inclusion of certain rules -------------------------------------------------------
mergeReads:
  activate: False

# text file containing list of chromosomes to keep when filtering ---------------------------
filter_chroms: True
keep_chroms: config/keep_chroms.txt

# reference genome options ------------------------------------------------------------------
ref_genome:
  name: dm6
  link: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/215/GCF_000001215.4_Release_6_plus_ISO1_MT/GCF_000001215.4_Release_6_plus_ISO1_MT_genomic.fna.gz

use_spikeIn: False

# concatenated mel/sim reference for hybrid ASE --------------------------------------------
# These files are expected to be prebuilt manually before running Snakemake.
ref_concat:
  activate: True

  genome:
    name: mel_sim_concat
    fasta: resources/mel_sim_concat/mel_sim_concat.fa

  annotation:
    name: mel_sim_concat_gtf
    gtf: resources/mel_sim_concat/mel_sim_concat.gtf

  # Will be generated by hisat2_index_concat rule in hybrid_ase.smk.
  hisat2_index:
    prefix: resources/mel_sim_concat/hisat2_index/mel_sim_concat

# hybrid ATAC-seq concat settings ------------------------------------------------
hybrid_atac:
  activate: True

  keep_chroms_concat: config/keep_chroms_concat.txt

  # Bowtie2 multimapping behavior for concat alignment
  keep_multimappers: True
  bowtie2_k: 10

  # Unique-only BAM branch
  make_unique_bams: True
  unique_filter_method: XS
  unique_bam_min_mapq: 20

# DESeq2 options -------------------------------------------------------------------------
run_diff_exp: False

diff_exp:
  experiments:
    Hybrid_RNAseq:
      contrasts:
        hybrid-vs-synthetic:
          - Hybrid_experimental
          - synthetic
  model: ~condition
  count_threshold: 50
  padj_cutoff: 0.05
  log2FC_cutoff: 1

# changes to rule paramters ---------------------------------------------------------------
params:
  bowtie2_index: ""

  # original dm6-only ATAC branch, kept for compatibility
  bowtie2_align: "-k 2 --very-sensitive --no-mixed --no-discordant -X 5000"

  # concat hybrid ATAC branch
  # hybrid_atac.smk appends: -k {hybrid_atac.bowtie2_k}
  bowtie2_align_concat: "--very-sensitive --no-mixed --no-discordant -X 5000"

  # original dm6-only filtering
  filter_multireads: "-f bam -F '(mapping_quality >= 30) and ([XS] == null)'"

  bigwigs_ind: "--binSize 10"
  bigwigs_merged: "--binSize 10"

  # kept, but not used while peak calling is paused
  macs2_call_atac_peaks_ind: "-f BAMPE --keep-dup all -g dm --call-summits"
  macs2_call_atac_peaks_merged: "-f BAMPE --keep-dup all -g dm --call-summits"
